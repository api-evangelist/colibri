aid: colibri
name: Colibri
description: >-
  ColibrITD (Colibri) is a French quantum-computing deep-tech company founded in
  2019 in Paris by Dr. Laurent Guiraud and Hacene Goudjil, with a mission to make
  quantum computing accessible to any enterprise. It develops quantum software for
  scientific and industrial applications, including QUICK (a quantum multiphysics
  simulation platform), QUICK-PDE (a Qiskit function for solving partial
  differential equations), the H-DES hybrid differential-equation solver, and MPQP
  (Multi-Platform Quantum Programming) - an open-source Python library for building
  quantum circuits and executing them across IBM Qiskit, Eviden myQLM, Google Cirq,
  AWS Braket, and Microsoft Azure Quantum backends. ColibrITD serves the
  semiconductors, finance, defense, aerospace, automotive, and energy industries.
  Its primary developer surface is the MPQP Python SDK (PyPI + GitHub) and its
  documentation, rather than a hosted REST API.
